  <circle cx="383" cy="359" r="55" fill="none" stroke="#58e5ff" stroke-opacity=".16"/>
  <circle cx="383" cy="359" r="76" fill="none" stroke="#58e5ff" stroke-opacity=".06" stroke-dasharray="3 8"/>
  <path d="M51 70h41" stroke="#ff8666" stroke-width="2"/>
</svg>

