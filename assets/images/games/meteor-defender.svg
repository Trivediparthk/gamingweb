<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="art-title">
  <title id="art-title">Meteor Defender original abstract key art</title>
  <defs>
    <linearGradient id="bg" x1="100" y1="0" x2="700" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101020"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(390 300) rotate(90) scale(310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8666" stop-opacity=".11"/>
      <stop offset=".55" stop-color="#8c70ff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#8c70ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a6f2ff"/>
      <stop offset="1" stop-color="#58e5ff"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb8a4"/>
      <stop offset=".5" stop-color="#ff8666"/>
      <stop offset="1" stop-color="#7b3023"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#halo)"/>
  <path d="M136 22 293 172" stroke="#ff8666" stroke-opacity=".1" stroke-width="32" filter="url(#blur)"/>
  <path d="M123 14 291 171" stroke="#ff8666" stroke-width="2" opacity=".25"/>
  <circle cx="299" cy="178" r="17" fill="url(#meteor)"/>
  <circle cx="294" cy="174" r="5" fill="#ffb8a4" opacity=".36"/>
  <path d="M407 18 529 232" stroke="#ff8666" stroke-opacity=".08" stroke-width="26" filter="url(#blur)"/>
  <path d="M418 8 534 214" stroke="#ff8666" stroke-width="1.5" opacity=".2"/>
  <circle cx="537" cy="232" r="27" fill="url(#meteor)"/>
  <circle cx="530" cy="225" r="8" fill="#ffb8a4" opacity=".32"/>
  <path d="M610 -10 665 114" stroke="#ff8666" stroke-width="1" opacity=".2"/>
  <circle cx="668" cy="123" r="12" fill="url(#meteor)"/>
  <path d="M474 141v19M464.5 150.5h19" stroke="#c9ff4a" stroke-width="1.5"/>
  <rect x="470" y="137" width="8" height="8" transform="rotate(45 474 141)" fill="#c9ff4a" opacity=".16"/>
