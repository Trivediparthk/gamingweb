<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="art-title">
  <title id="art-title">Memory Matrix original abstract key art</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1020"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151d33"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b9a8ff"/>
      <stop offset="1" stop-color="#6c4df0"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a6f2ff"/>
      <stop offset="1" stop-color="#25a9c9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(412 251) rotate(90) scale(255)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8c70ff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#8c70ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#halo)"/>
