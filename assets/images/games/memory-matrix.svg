      <rect x="66" y="160" width="56" height="70" rx="6"/>
      <rect x="132" y="160" width="56" height="70" rx="6"/>
      <rect x="198" y="160" width="56" height="70" rx="6"/>
      <rect x="0" y="240" width="56" height="70" rx="6"/>
