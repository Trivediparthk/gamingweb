    <rect x="-28" y="-51" width="56" height="31" rx="9" fill="#0b1b25" stroke="#facc15" stroke-opacity=".4"/>
    <rect x="-19" y="-41" width="38" height="6" rx="3" fill="#fb923c"/>
    <path d="M0-51v-10" stroke="#facc15" stroke-width="1.5"/><circle cx="0" cy="-63" r="3" fill="#fb923c"/>
    <rect x="-13" y="29" width="8" height="3" fill="#facc15"/><rect x="1" y="29" width="8" height="3" fill="#facc15" opacity=".35"/>
  </g>
  <g transform="translate(400 338)">
