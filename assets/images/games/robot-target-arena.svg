    <rect x="-21" y="-46" width="42" height="28" rx="8" fill="#0b1b25" stroke="#f472b6" stroke-opacity=".4"/>
    <circle cx="-9" cy="-33" r="3.2" fill="#fda4af"/><circle cx="9" cy="-33" r="3.2" fill="#fda4af"/>
    <path d="M0-46v-10" stroke="#f472b6" stroke-width="1.5"/><circle cx="0" cy="-58" r="3" fill="#a3e635"/>
    <path d="M-16 23h32" stroke="#f472b6" stroke-opacity=".4" stroke-width="2"/>
