  <path d="M124 43h552" stroke="#67e8f9" stroke-opacity=".18"/>
  <path d="M270 52h260" stroke="#67e8f9" stroke-opacity=".12" stroke-width="5"/>
  <path d="M270 52h170" stroke="#a3e635" stroke-width="5"/>
