    <circle cx="400" cy="254" r="238"/>
    <path d="M0 254h800M400 40v400"/>
  </g>
  <g fill="none" stroke="#a5f3fc" stroke-opacity=".18">
    <circle cx="180" cy="200" r="54"/><circle cx="620" cy="200" r="54"/>
    <circle cx="400" cy="338" r="58"/>
    <path d="M180 146v-26M180 254v26M620 146v-26M620 254v26M400 280v-20M400 396v20"/>
  </g>
  <g fill="#a5f3fc" opacity=".36" font-family="monospace" font-size="9">
    <text x="160" y="270">B01</text><text x="600" y="270">B02</text>
    <text x="383" y="412">B03</text>
  </g>
  <path d="M0 418h800v82H0z" fill="#051019"/>
