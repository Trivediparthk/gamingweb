<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="art-title">
  <title id="art-title">Robot Target Arena original abstract key art</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060b15"/>
      <stop offset=".6" stop-color="#0a1422"/>
      <stop offset="1" stop-color="#051019"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(400 252) rotate(90) scale(330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#7c61ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scout" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1d5a58"/>
      <stop offset="1" stop-color="#08141d"/>
    </linearGradient>
    <linearGradient id="brute" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#51422a"/>
      <stop offset="1" stop-color="#08141d"/>
    </linearGradient>
    <linearGradient id="zip" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6b214d"/>
      <stop offset="1" stop-color="#08141d"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#67e8f9" stroke-opacity=".06"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".1">
