    <rect x="-27" y="34" width="54" height="15" rx="7" fill="#06131b" stroke="#f472b6" stroke-opacity=".25"/>
    <rect x="-34" y="0" width="11" height="30" rx="4" fill="#10202b"/><rect x="23" y="0" width="11" height="30" rx="4" fill="#10202b"/>
