<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="art-title">
  <title id="art-title">Metro Sprint original abstract key art</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030b15"/>
      <stop offset=".55" stop-color="#071b2e"/>
      <stop offset="1" stop-color="#04121e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(404 158) rotate(90) scale(250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#7c61ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="400" y1="230" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d3544"/>
      <stop offset="1" stop-color="#05131f"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#67e8f9" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <path d="M0 220h800" stroke="#22d3ee" stroke-opacity=".2"/>
  <path d="M0 230h800" stroke="#7c61ff" stroke-opacity=".16"/>
  <!-- Skyline -->
  <g fill="#061b2a">
    <path d="M0 228V130h38v42h22V94h47v74h29v60ZM610 228V102h38v-27h42v76h24v77Z"/>
  </g>
  <g fill="#67e8f9" opacity=".28">
    <rect x="18" y="150" width="7" height="4"/><rect x="35" y="162" width="7" height="4"/>
    <rect x="74" y="122" width="7" height="4"/><rect x="91" y="137" width="7" height="4"/>
    <rect x="637" y="120" width="7" height="4"/><rect x="661" y="143" width="7" height="4"/>
  </g>
  <g fill="#f472b6" opacity=".35">
    <rect x="128" y="166" width="5" height="5"/><rect x="670" y="86" width="4" height="10"/>
    <rect x="283" y="119" width="4" height="7"/><rect x="552" y="150" width="4" height="7"/>
  </g>
  <!-- Rain -->
  <g stroke="#a5f3fc" stroke-opacity=".2" stroke-width="1.2">
    <path d="m70 34-12 38M164 8l-14 42M288 46l-12 36M390 18l-14 44M508 57l-11 31M646 24l-13 40M738 60l-11 32"/>
    <path d="m120 92-9 25M344 104l-9 26M576 86l-10 28M702 118l-8 22"/>
  </g>
  <!-- Platform silhouette -->
  <path d="M0 0h800v16L0 30V0Z" fill="#020a12"/>
  <g fill="#22d3ee" opacity=".45">
    <rect x="52" y="22" width="45" height="2"/><rect x="219" y="18" width="45" height="2"/>
    <rect x="389" y="15" width="45" height="2"/><rect x="559" y="12" width="45" height="2"/>
    <rect x="707" y="10" width="45" height="2"/>
  </g>
  <circle cx="399" cy="288" r="126" fill="#22d3ee" opacity=".05" filter="url(#blur)"/>
  <!-- Curved track -->
  <path d="M296 228h208l118 272H178l118-272Z" fill="url(#floor)"/>
  <path d="M282 228h236" stroke="#67e8f9" stroke-opacity=".55" stroke-width="2"/>
  <path d="M178 500l118-272M622 500 504 228" stroke="#22d3ee" stroke-opacity=".62" stroke-width="2.5"/>
  <path d="M214 500l100-255M586 500 486 245" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="M399 500V228" stroke="#a5f3fc" stroke-opacity=".32" stroke-dasharray="16 16" stroke-width="2"/>
  <g stroke="#67e8f9" stroke-opacity=".22" stroke-width="2">
    <path d="M356 462h88M336 386h128M315 314h170M300 258h198"/>
  </g>
  <g fill="#f472b6">
    <circle cx="194" cy="338" r="2.5"/><circle cx="607" cy="298" r="2.5"/>
    <circle cx="164" cy="438" r="2"/><circle cx="638" cy="422" r="2"/>
  </g>
  <!-- Low barrier -->
  <g transform="translate(512 330)">
    <rect x="-56" y="-21" width="112" height="22" rx="4" fill="#0c2f3e" stroke="#67e8f9" stroke-width="1.5"/>
    <path d="M-47-21 10 1M-25-21 32 1M-3-21 54 1M19-21 76 1" stroke="#facc15" stroke-opacity=".65" stroke-width="7"/>
    <path d="M-46-24h12M34-24h12" stroke="#f472b6" stroke-width="3"/>
  </g>
  <!-- Courier -->
  <g transform="translate(377 400)">
    <ellipse cx="0" cy="27" rx="39" ry="10" fill="#020a12" opacity=".65"/>
    <path d="M-10 8 4-14M12 8 19-20" stroke="#071a28" stroke-width="12" stroke-linecap="round"/>
    <path d="M-17 10h14M17 9h16" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
    <rect x="-20" y="-60" width="40" height="42" rx="9" fill="#0e7490"/>
    <rect x="-20" y="-60" width="13" height="42" fill="#67e8f9"/>
    <rect x="-25" y="-53" width="20" height="28" rx="6" fill="#071b2a" stroke="#22d3ee" stroke-width="1.2"/>
    <rect x="-19" y="-47" width="9" height="2" fill="#67e8f9" opacity=".7"/>
    <path d="M-15-56c-21 2-31 12-41 27" stroke="#f472b6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="-71" r="11" fill="#d0eef2"/>
    <path d="M-11-73c0-9 8-13 11-13s11 4 11 13" fill="#0b3141"/>
    <circle cx="5" cy="-70" r="2" fill="#67e8f9"/>
    <path d="M-11 9h9M16 8h9" stroke="#facc15" stroke-width="2"/>
  </g>
  <!-- Tokens -->
  <g fill="none" stroke="#67e8f9" stroke-width="1.5">
    <path d="m239 274 8 7-8 7-8-7 8-7Z"/>
    <path d="m600 203 6 5-6 5-6-5 6-5Z" opacity=".7"/>
  </g>
  <g fill="#f472b6" opacity=".7">
    <circle cx="255" cy="166" r="2"/><circle cx="521" cy="115" r="2"/>
  </g>
  <path d="M51 54h24M51 54v24M749 446h-24M749 446v-24" fill="none" stroke="#f2f6e8" stroke-opacity=".5" stroke-width="1.5"/>
</svg>
