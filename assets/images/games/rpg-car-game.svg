<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Original off-road car game key art">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a0e"/>
      <stop offset="55%" stop-color="#8a4a1c"/>
      <stop offset="100%" stop-color="#d98a3d"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98a4a"/>
      <stop offset="100%" stop-color="#7a4d28"/>
    </linearGradient>
    <linearGradient id="duneFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5642f"/>
      <stop offset="100%" stop-color="#4f301a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6a8"/>
      <stop offset="60%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff8a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0452f"/>
      <stop offset="100%" stop-color="#8c1f14"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe6ff"/>
      <stop offset="100%" stop-color="#4a86b8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <circle cx="880" cy="180" r="150" fill="url(#sun)" opacity="0.85"/>
  <circle cx="880" cy="180" r="62" fill="#ffcf7a" opacity="0.9"/>

  <path d="M0 360 Q 240 300 480 350 T 980 340 T 1200 360 L1200 630 L0 630 Z" fill="url(#dune)" opacity="0.85"/>
  <path d="M0 460 Q 300 400 620 450 T 1200 430 L1200 630 L0 630 Z" fill="url(#duneFront)"/>

  <g opacity="0.55" fill="#2a1608">
    <circle cx="120" cy="300" r="4"/>
    <circle cx="180" cy="285" r="3"/>
    <circle cx="1020" cy="290" r="4"/>
    <circle cx="1075" cy="278" r="3"/>
  </g>

  <g transform="translate(430 352) rotate(-8)">
    <ellipse cx="120" cy="120" rx="230" ry="26" fill="#1a0d04" opacity="0.45" filter="url(#soft)"/>
    <rect x="20" y="60" width="240" height="46" rx="14" fill="url(#carBody)"/>
    <rect x="62" y="26" width="130" height="44" rx="12" fill="#b3301f"/>
    <rect x="74" y="34" width="48" height="28" rx="6" fill="url(#glass)"/>
    <rect x="132" y="34" width="48" height="28" rx="6" fill="url(#glass)"/>
    <rect x="14" y="70" width="18" height="26" rx="4" fill="#2a2a2a"/>
    <rect x="248" y="70" width="18" height="26" rx="4" fill="#2a2a2a"/>
    <rect x="20" y="52" width="240" height="8" rx="4" fill="#ffb347" opacity="0.7"/>
    <g>
      <circle cx="76" cy="112" r="30" fill="#161616"/>
      <circle cx="76" cy="112" r="14" fill="#8a8a8a"/>
      <circle cx="76" cy="112" r="6" fill="#3a3a3a"/>
      <circle cx="212" cy="112" r="30" fill="#161616"/>
      <circle cx="212" cy="112" r="14" fill="#8a8a8a"/>
      <circle cx="212" cy="112" r="6" fill="#3a3a3a"/>
    </g>
    <rect x="236" y="44" width="10" height="18" rx="2" fill="#ffe6a8" opacity="0.9"/>
  </g>

  <g fill="#d9b98a" opacity="0.5">
    <path d="M0 560 Q 200 520 420 560 T 860 555 T 1200 560 L1200 630 L0 630 Z"/>
  </g>

  <g font-family="Inter, Arial, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="120" font-size="20" font-weight="600" letter-spacing="8" fill="#ffcf7a" opacity="0.9">ROBLOXSPLAY</text>
    <text x="600" y="182" font-size="72" font-weight="800" fill="#ffffff">RPG CAR GAME</text>
    <text x="600" y="224" font-size="26" font-weight="600" letter-spacing="4" fill="#ffd27a">OFF-ROAD DRIVING</text>
  </g>

  <g transform="translate(600 600)" text-anchor="middle" font-family="Inter, Arial, system-ui, sans-serif">
    <rect x="-118" y="-24" width="236" height="44" rx="22" fill="#000000" opacity="0.35"/>
    <text x="0" y="5" font-size="18" font-weight="600" letter-spacing="3" fill="#ffe6a8">WEBGPU 3D</text>
  </g>
</svg>
