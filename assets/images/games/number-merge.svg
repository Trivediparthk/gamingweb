<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="art-title">
  <title id="art-title">Number Merge original abstract key art</title>
  <defs>
    <linearGradient id="bg" x1="120" y1="0" x2="700" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1320"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172135"/>
      <stop offset="1" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ddff87"/>
      <stop offset="1" stop-color="#8fc72b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(570 250) rotate(90) scale(230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c9ff4a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#c9ff4a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#halo)"/>
  <g transform="translate(207 72) rotate(-4 200 180)">
    <rect x="0" y="0" width="365" height="365" rx="18" fill="#080d16" stroke="#ffffff" stroke-opacity=".1"/>
    <g fill="url(#tile)" stroke="#ffffff" stroke-opacity=".07">
      <rect x="20" y="20" width="72" height="72" rx="8"/>
      <rect x="105" y="20" width="72" height="72" rx="8"/>
      <rect x="190" y="20" width="72" height="72" rx="8"/>
      <rect x="275" y="20" width="72" height="72" rx="8"/>
      <rect x="20" y="105" width="72" height="72" rx="8"/>
      <rect x="105" y="105" width="72" height="72" rx="8"/>
      <rect x="190" y="105" width="72" height="72" rx="8"/>
      <rect x="275" y="105" width="72" height="72" rx="8"/>
      <rect x="20" y="190" width="72" height="72" rx="8"/>
      <rect x="105" y="190" width="72" height="72" rx="8"/>
      <rect x="190" y="190" width="72" height="72" rx="8"/>
      <rect x="275" y="190" width="72" height="72" rx="8"/>
      <rect x="20" y="275" width="72" height="72" rx="8"/>
