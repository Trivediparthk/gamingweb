<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="art-title">
  <title id="art-title">Neon Street Racer original abstract key art</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040712"/>
      <stop offset=".55" stop-color="#0b1028"/>
      <stop offset="1" stop-color="#120d24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(408 152) rotate(90) scale(300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f472b6" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#7c61ff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#7c61ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="400" y1="224" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181832"/>
      <stop offset="1" stop-color="#080b17"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="-74" x2="0" y2="-20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#a5f3fc" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="408" cy="154" r="96" fill="#f472b6" opacity=".06" filter="url(#blur)"/>
  <circle cx="408" cy="154" r="42" fill="none" stroke="#f472b6" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="408" cy="154" r="58" fill="none" stroke="#a78bfa" stroke-opacity=".28" stroke-width="1"/>
  <circle cx="408" cy="154" r="18" fill="#f9a8d4" opacity=".35"/>
  <!-- skyline -->
  <g fill="#090c1a">
    <path d="M0 235V155h35v-44h29v42h38v82ZM700 235V120h41v-34h44v68h15v81Z"/>
  </g>
  <g fill="#67e8f9" opacity=".3">
    <rect x="16" y="174" width="6" height="3"/><rect x="33" y="190" width="6" height="3"/>
    <rect x="73" y="139" width="5" height="4"/><rect x="90" y="157" width="5" height="4"/>
    <rect x="714" y="139" width="6" height="3"/><rect x="741" y="164" width="6" height="3"/>
    <rect x="159" y="190" width="5" height="3"/><rect x="637" y="178" width="5" height="3"/>
  </g>
  <g fill="#f472b6" opacity=".35">
    <rect x="125" y="201" width="4" height="4"/><rect x="278" y="145" width="4" height="4"/>
    <rect x="541" y="173" width="4" height="4"/><rect x="662" y="115" width="4" height="4"/>
  </g>
  <!-- road -->
  <path d="M316 224h168l208 276H108l208-276Z" fill="url(#road)"/>
  <path d="M108 500 316 224M692 500 484 224" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M108 500 316 224" stroke="#a78bfa" stroke-opacity=".4" stroke-width="1.5"/>
  <path d="M356 500 372 224M444 500 428 224" stroke="#f2f6e8" stroke-opacity=".55" stroke-width="2" stroke-dasharray="17 17"/>
  <path d="M288 292h224M260 352h280M228 424h344M195 500h410" stroke="#67e8f9" stroke-opacity=".13"/>
  <g fill="#22d3ee">
    <circle cx="118" cy="360" r="2.5"/><circle cx="676" cy="326" r="2.5"/>
    <circle cx="156" cy="456" r="2"/><circle cx="650" cy="440" r="2"/>
  </g>
  <!-- traffic car -->
  <g transform="translate(530 333)">
    <ellipse cx="0" cy="10" rx="62" ry="15" fill="#02030a" opacity=".8"/>
    <circle cx="-45" cy="8" r="11" fill="#03050b"/><circle cx="45" cy="8" r="11" fill="#03050b"/>
    <path d="M-52-7c2-16 15-23 28-24h45c15 2 27 9 30 24v16c0 5-4 8-10 8h-83c-6 0-10-3-10-8V-7Z" fill="#3c1361"/>
    <path d="M-31-26c8-13 19-17 31-17s22 4 30 17l-6 13H-25l-6-13Z" fill="#12051f"/>
    <path d="M-42-4h27v5h-27zM17-4h28v5H17z" fill="#f9a8d4"/>
    <path d="M-31-46h60" stroke="#f472b6" stroke-width="3" opacity=".55"/>
  </g>
  <!-- player car -->
  <g transform="translate(400 425)">
    <ellipse cx="0" cy="23" rx="98" ry="20" fill="#22d3ee" opacity=".12" filter="url(#blur)"/>
    <ellipse cx="0" cy="16" rx="76" ry="13" fill="#02030a" opacity=".8"/>
    <circle cx="-55" cy="9" r="14" fill="#03050b"/><circle cx="55" cy="9" r="14" fill="#03050b"/>
    <path d="M-67-17c5-29 21-42 40-45h54c20 3 37 16 40 45v30c0 8-6 13-14 13H-53c-8 0-14-5-14-13V-17Z" fill="url(#body)" stroke="#e7feff" stroke-opacity=".35"/>
    <path d="M-39-54c10-20 22-26 39-26s30 6 39 26L31-27H-31l-8-27Z" fill="#031b26" stroke="#67e8f9" stroke-opacity=".35"/>
    <rect x="-53" y="-15" width="34" height="7" rx="3" fill="#f472b6"/>
    <rect x="19" y="-15" width="34" height="7" rx="3" fill="#f472b6"/>
    <path d="M-63-72h126" stroke="#07111a" stroke-width="7"/>
    <path d="M-63-72h126" stroke="#a3e635" stroke-width="1.5"/>
    <path d="M-47-69v15M47-69v15" stroke="#07111a" stroke-width="4"/>
    <path d="M-32-4h64" stroke="#07111a" stroke-width="8"/>
    <path d="m-11-38 13 10-13 11" stroke="#a3e635" stroke-width="2.5" fill="none"/>
  </g>
  <g fill="none" stroke="#f2f6e8" stroke-opacity=".5">
    <path d="M51 54h24M51 54v24M749 446h-24M749 446v-24" stroke-width="1.5"/>
  </g>
</svg>
